name: Publier une version

# Bouton « Run workflow » de l'onglet Actions : publie la version indiquée dans
# package.json (ex. 2.0.2) sous forme de release GitHub « v2.0.2 », avec l'APK
# Android en pièce jointe et des notes générées à partir des pull requests
# fusionnées depuis la version précédente.
#
# Avant : passer APP_VERSION (js/shared/version.js) et package.json à la
# nouvelle version, et fusionner dans main.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Préversion (test, non proposée comme « dernière version »)"
        type: boolean
        default: false

# Lecture seule par défaut : seul le job « publier » reçoit le droit d'écrire,
# uniquement pour créer le tag et la release.
permissions:
  contents: read

# Jamais deux publications en même temps.
concurrency:
  group: release
  cancel-in-progress: false

# Actions tierces épinglées sur un commit précis : voir la note dans test.yml.
jobs:
  verifier:
    name: Vérifier la version et les tests
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Version à publier
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide dans package.json : $VERSION"; exit 1
          fi
          APP=$(sed -n 's/^const APP_VERSION = "\(.*\)";.*/\1/p' js/shared/version.js)
          if [ "$APP" != "$VERSION" ]; then
            echo "::error::package.json ($VERSION) et js/shared/version.js ($APP) ne correspondent pas"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::La version v$VERSION est déjà publiée : changez la version avant de relancer"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version à publier : $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: ESLint
        run: npm run lint

  apk:
    name: Construire l'APK
    needs: verifier
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit

  publier:
    name: Créer la release
    needs: [verifier, apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Récupérer l'APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jf-pickleball-*-apk
          path: apk
          merge-multiple: true

      - name: Créer la release et y joindre l'APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verifier.outputs.version }}
          SIGNED: ${{ needs.apk.outputs.signed }}
          PRERELEASE: ${{ inputs.prerelease }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          SOURCE=$(ls apk/*.apk | head -n 1)
          if [ "$SIGNED" = "true" ]; then
            APK="jf-pickleball-$VERSION.apk"
            NOTES="**Android** : installez \`$APK\` ; il se met à jour par-dessus la version précédente sans perdre vos données."
          else
            APK="jf-pickleball-$VERSION-non-signe.apk"
            NOTES="**Android** : \`$APK\` est un APK de test, sans signature permanente. Pour l'installer, **désinstallez d'abord la version précédente** : cela efface les données de l'application sur le téléphone (session en cours, historique, groupes de joueurs)."
          fi
          NOTES="$NOTES

          **Version web** (sans installation, fonctionne aussi hors ligne) : $SITE"
          cp "$SOURCE" "$APK"
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "v$VERSION" "$APK" \
            --target "$GITHUB_SHA" \
            --title "JF Pickleball $VERSION" \
            --notes "$NOTES" \
            --generate-notes \
            "${FLAGS[@]}"
          echo "Release v$VERSION publiée avec $APK" >> "$GITHUB_STEP_SUMMARY"
