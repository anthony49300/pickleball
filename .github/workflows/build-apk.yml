name: Build Android APK

# Ne se déclenche plus automatiquement sur push (build long, pas nécessaire à
# chaque commit) : uniquement à la demande, depuis l'onglet "Actions" de GitHub.
on:
  workflow_dispatch:

# Jeton GITHUB_TOKEN en lecture seule : ces workflows n'écrivent rien dans le dépôt.
permissions:
  contents: read

# Actions tierces épinglées sur un commit précis : voir la note dans test.yml.
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    # APK de release signé seulement si le keystore est configuré dans les
    # secrets du dépôt (voir README, « APK signé ») ; sinon APK de debug.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Installer le JDK (requis par Gradle/Android)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Mettre en cache les dépendances Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Installer les dépendances Capacitor
        run: npm ci

      # Capacitor interdit webDir="." (racine du dépôt) pour ne pas risquer d'embarquer
      # node_modules/.git/etc. dans l'APK. On copie donc uniquement les fichiers du site
      # dans un dossier www/ dédié (non versionné, voir .gitignore), utilisé comme webDir.
      - name: Préparer les assets web (dossier www/)
        run: |
          mkdir -p www
          cp index.html tournoi.html manifest.json icon-192.png icon-512.png icon-pickleball.svg www/
          cp -r css www/
          cp -r fonts www/
          cp -r js www/

      # Le dossier android/ n'est pas versionné (voir .gitignore) : Capacitor le régénère
      # à chaque run à partir de capacitor.config.json, puis y copie le contenu de www/.
      - name: Générer le projet Android
        run: npx cap add android

      # Par défaut, la WebView Android ignore le <meta name="viewport"> de index.html et
      # rend la page comme un site desktop (~980px de large) avant de la réduire pour
      # qu'elle tienne à l'écran — d'où l'effet "page miniature/dézoomée" observé sur
      # téléphone. On force explicitement le mode viewport mobile dans MainActivity,
      # ce que Capacitor ne configure pas automatiquement.
      - name: Forcer le viewport mobile dans la WebView (fix page dézoomée)
        run: |
          mkdir -p android/app/src/main/java/com/jfpickleball/app
          cat > android/app/src/main/java/com/jfpickleball/app/MainActivity.java << 'EOF'
          package com.jfpickleball.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
          @Override
          public void onCreate(Bundle savedInstanceState) {
          super.onCreate(savedInstanceState);
          this.bridge.getWebView().getSettings().setUseWideViewPort(true);
          this.bridge.getWebView().getSettings().setLoadWithOverviewMode(true);
          }
          }
          EOF

      - name: Synchroniser le site web dans le projet Android
        run: npx cap sync android

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Compiler l'APK (debug, non signé)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK de debug en téléchargement
        if: env.HAS_KEYSTORE != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jf-pickleball-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Release signée : le keystore n'existe que le temps du build, dans le
      # dossier temporaire du runner, et les mots de passe passent par des
      # variables d'environnement (masquées dans les journaux).
      - name: Compiler et signer l'APK de release
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          # apksigner (utilisé par « cap build ») vient des build-tools du SDK
          # Android préinstallé sur le runner, absents du PATH par défaut.
          export PATH="$PATH:$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          npx cap build android \
            --keystorepath "$KEYSTORE" \
            --keystorepass "$ANDROID_KEYSTORE_PASSWORD" \
            --keystorealias "$ANDROID_KEY_ALIAS" \
            --keystorealiaspass "$ANDROID_KEY_PASSWORD" \
            --androidreleasetype APK
          rm -f "$KEYSTORE"

      - name: Publier l'APK signé en téléchargement
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jf-pickleball-release-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
