<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pickleball JF</title>
  
  <!-- Favicon basée sur l'émoji balle de tennis/pickleball -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎾</text></svg>">
  
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="container">
    <h1>🎾 JF Pickleball</h1>
  </header>

  <main class="container grid">
    <section class="card">
      <h2>Données d'entrée</h2>

      <label class="label" for="players">Joueurs (un par ligne ou séparés par des virgules)</label>
      <textarea id="players" rows="8" placeholder="Appi, Basha, Chris, Daryl&#10;Satish&#10;Srini"></textarea>

      <div class="row">
        <div>
          <label class="label" for="courts">Terrains</label>
          <input id="courts" type="number" min="1" max="10" value="2" />
        </div>
        <div>
          <label class="label" for="rounds">Tours</label>
          <input id="rounds" type="number" min="1" max="50" value="8" />
        </div>
        <div>
          <label class="label" for="seed">ID Session</label>
          <div style="display:flex; gap:8px;">
            <input id="seed" type="text" placeholder="Génération auto numéro session" />
            <button id="newSeed" class="secondary" title="Générer une nouvelle ID de session">🔀</button>
          </div>
        </div>
      </div>

      <details class="details">
        <summary>Options avancées (optionnel)</summary>
        <div class="row">
          <div>
            <label class="label" for="wT">wT (poids partenaires répétés)</label>
            <input id="wT" type="number" min="0" max="20" step="0.5" value="5" />
          </div>
          <div>
            <label class="label" for="wO">wO (poids adversaires répétés)</label>
            <input id="wO" type="number" min="0" max="20" step="0.5" value="2" />
          </div>
          <div>
            <label class="label" for="wP">wP (poids équilibre de jeu)</label>
            <input id="wP" type="number" min="0" max="10" step="0.25" value="1" />
          </div>
        </div>

        <div class="row">
          <div>
            <label class="label" for="beamWidth">Largeur du faisceau (Beam width)</label>
            <input id="beamWidth" type="number" min="10" max="500" step="10" value="80" />
          </div>
          <div>
            <label class="label" for="partnerK">Présélection partenaires (K)</label>
            <input id="partnerK" type="number" min="4" max="30" step="1" value="10" />
          </div>
          <div class="checkbox">
            <input id="squareRepeats" type="checkbox" checked />
            <label for="squareRepeats">Pénalités quadratiques pour les répétitions</label>
          </div>
        </div>

        <div class="row">
          <div class="checkbox">
            <input id="avoidB2B" type="checkbox" checked />
            <label for="avoidB2B">Éviter d'être sur le banc deux fois d'affilée</label>
          </div>
        </div>
      </details>

      <div class="actions">
        <button id="generate">Générer</button>
        <button id="copy" class="secondary" disabled>Copier le planning</button>
        <button id="copyLink" class="secondary" disabled>Copier le lien</button>
      </div>

      <p id="warning" class="warning" hidden></p>
      <p id="error" class="error" hidden></p>
    </section>

    <section class="card">
      <div class="headerRow">
        <h2>Matchs</h2>
        <span id="meta" class="subtle"></span>
      </div>
      <div id="schedule" class="schedule"></div>
    </section>

    <section class="card">
      <h2>Statistiques</h2>
      <div id="diagnostics" class="diagnostics subtle">
        <p>Générez un planning pour consulter les statistiques.</p>
      </div>
    </section>
  </main>

  <footer class="container subtle footer">
    <p>JF Pickleball</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
